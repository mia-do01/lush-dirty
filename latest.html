<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIRTY — Latest Interactive Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#site{border:0;width:100%;height:100%;display:block;background:#000}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#fff;font:11px Arial,sans-serif;letter-spacing:.28em;z-index:20;transition:opacity .45s}
</style>
</head>
<body>
<div id="loading">DIRTY / LOADING</div>
<iframe id="site" src="/index.html?asset-source=1"></iframe>
<script>
const frame=document.getElementById('site');
const loading=document.getElementById('loading');

frame.addEventListener('load',async()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!w||!d)return;

  const pick=(sel)=>d.querySelector(sel);
  const originalProduct=pick('#product')||pick('.product');
  const originalLogo=pick('#heroLogo')||pick('.hero-logo');
  const originalSandal=pick('#sandalBack')||pick('.sandal-back')||pick('.forest-bg');
  const originalGrass=pick('.grass-bg');
  const originalLeafImgs=[...d.querySelectorAll('.leaf-field img,.leaf-layer img,.leaf')].filter(x=>x.src);
  const productSrc=originalProduct?.src||'';
  const logoSrc=originalLogo?.src||'';
  const sandalBg=originalSandal?getComputedStyle(originalSandal).backgroundImage:'none';
  const grassBg=originalGrass?getComputedStyle(originalGrass).backgroundImage:'none';
  const leafSources=[...new Set(originalLeafImgs.map(x=>x.src))];

  async function tightLogo(src){
    if(!src)return src;
    return new Promise(resolve=>{
      const img=new Image();
      img.onload=()=>{
        try{
          const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;
          const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0);
          const data=ctx.getImageData(0,0,c.width,c.height).data;
          let minX=c.width,minY=c.height,maxX=-1,maxY=-1;
          for(let y=0;y<c.height;y+=2){
            for(let x=0;x<c.width;x+=2){
              if(data[(y*c.width+x)*4+3]>12){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)}
            }
          }
          if(maxX<0)return resolve(src);
          const out=document.createElement('canvas');out.width=maxX-minX+4;out.height=maxY-minY+4;
          out.getContext('2d').drawImage(c,minX-2,minY-2,out.width,out.height,0,0,out.width,out.height);
          resolve(out.toDataURL('image/png'));
        }catch(e){resolve(src)}
      };
      img.onerror=()=>resolve(src);img.src=src;
    });
  }
  const croppedLogo=await tightLogo(logoSrc);

  d.head.innerHTML=`
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DIRTY — Interactive Scent Experience</title>
  <style>
  :root{--mint:#10d9de;--skyTop:#e9ffff;--skyMid:#baf4f2;--skyLow:#84e5e7;--meadow:#93bd69}
  *{box-sizing:border-box}html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
  .sticky{position:sticky;top:0;height:100vh;overflow:hidden;isolation:isolate}
  .copy{position:absolute;left:52px;top:44px;z-index:50;opacity:0;transform:translateY(18px);pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.18)}
  .note{font-size:clamp(34px,3.2vw,66px);font-weight:800;letter-spacing:.015em}.keywords{margin-top:10px;font-size:12px;letter-spacing:.28em;color:rgba(255,255,255,.8)}
  .tip{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);z-index:55;font-size:11px;letter-spacing:.22em;color:rgba(255,255,255,.76)}
  #exp{height:900vh;background:#000}.exp-stage{background:#000}
  #paint{position:absolute;inset:0;z-index:4;pointer-events:none}
  #mintRise{position:absolute;inset:0;z-index:6;opacity:0;transform:translateY(100%);background:linear-gradient(to top,var(--mint) 0%,rgba(16,217,222,.99) 42%,rgba(16,217,222,.88) 68%,rgba(16,217,222,.5) 86%,rgba(16,217,222,0) 100%)}
  #mintSolid{position:absolute;inset:0;z-index:7;opacity:0;background:var(--mint)}
  .sky{background:radial-gradient(ellipse 31% 15% at 23% 17%,rgba(255,255,255,.56),transparent 64%),radial-gradient(ellipse 24% 12% at 60% 14%,rgba(255,255,255,.36),transparent 62%),radial-gradient(ellipse 19% 10% at 82% 24%,rgba(255,255,255,.24),transparent 62%),linear-gradient(to bottom,var(--skyTop) 0%,var(--skyMid) 25%,var(--skyLow) 60%,var(--mint) 100%)}
  #sky{position:absolute;inset:0;z-index:8;opacity:0}
  #pw{position:absolute;width:760px;aspect-ratio:1173/1341;z-index:15;transform-origin:0 0;pointer-events:none}
  #bottle{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;filter:drop-shadow(0 24px 32px rgba(0,0,0,.3))}
  #logo{position:absolute;left:55.6266%;top:60.6637%;width:31.1168%;height:auto;transform:translate(-50%,-50%);opacity:1}
  .splash{position:absolute;background:var(--mint);opacity:0;transform:translate(-50%,-50%) scale(.05);filter:blur(.5px);will-change:transform,opacity}
  #mintCopy{z-index:51}#touch{opacity:0}
  #sandal{height:440vh;background:var(--mint)}.sandal-stage{background:var(--mint)}
  #sandalSky{position:absolute;inset:0;z-index:0}
  #branchBg{position:absolute;inset:-3%;z-index:1;opacity:0;background-size:cover!important;background-position:center 52%!important;filter:saturate(.83) brightness(1.08);transform:scale(1.07)}
  #softLight{position:absolute;inset:0;z-index:2;opacity:0;background:radial-gradient(circle at 60% 20%,rgba(255,252,220,.58),transparent 28%),linear-gradient(to bottom,rgba(255,255,255,.08),transparent 54%)}
  #leafField{position:absolute;inset:-7%;z-index:8;opacity:0;overflow:hidden;pointer-events:none}
  .leaf{position:absolute;will-change:transform;filter:saturate(.72) brightness(.92) drop-shadow(0 8px 10px rgba(0,0,0,.13));transform-origin:center}
  #windHalo{position:absolute;width:210px;height:210px;border-radius:50%;transform:translate(-50%,-50%);z-index:9;opacity:0;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,.05) 34%,transparent 73%);mix-blend-mode:screen}
  #sandalToMeadow{position:absolute;inset:0;z-index:12;opacity:0;background:linear-gradient(to bottom,rgba(132,229,231,0) 0%,rgba(116,198,159,.14) 28%,rgba(147,189,105,.62) 70%,rgba(147,189,105,.98) 100%);pointer-events:none}
  #lav{height:620vh;background:var(--meadow)}.lav-stage{background:var(--meadow)}
  #grass{position:absolute;inset:0;z-index:0;background-size:cover!important;background-position:center 50%!important;filter:saturate(.96) contrast(1.06) brightness(1.04)}
  #lavLight{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse at 50% 0%,rgba(255,250,205,.26),transparent 34%),linear-gradient(to bottom,rgba(177,238,230,.18),transparent 32%)}
  #forestCarry{position:absolute;inset:0;z-index:2;opacity:1;background-size:cover!important;background-position:center 63%!important;-webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 58%,rgba(0,0,0,.45) 82%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,#000 58%,rgba(0,0,0,.45) 82%,transparent 100%)}
  #blooms{position:absolute;inset:0;z-index:5;pointer-events:none}.sprig{position:absolute;width:22px;transform-origin:50% 100%;opacity:0}.stem{position:absolute;left:50%;bottom:0;width:2px;height:100%;background:rgba(72,101,50,.83);transform:translateX(-50%)}.bud{position:absolute;width:8px;height:12px;border-radius:60% 60% 50% 50%;background:#8f7ab4;box-shadow:0 0 0 1px rgba(255,255,255,.07)}
  #blackFade{position:absolute;inset:0;z-index:20;opacity:0;background:linear-gradient(to bottom,transparent 30%,rgba(0,0,0,.15) 52%,rgba(0,0,0,.53) 75%,rgba(0,0,0,.86) 90%,#000 100%);pointer-events:none}
  #segment{height:480vh;background:#000}.seg-stage{background:#000;display:flex;align-items:center;justify-content:center}.seg-wrap{width:min(1180px,92vw);opacity:0;transform:translateY(28px)}.eyebrow{text-align:center;font-size:11px;letter-spacing:.34em;color:rgba(255,255,255,.48)}.seg-title{text-align:center;font-size:clamp(40px,5vw,78px);line-height:1.02;margin:18px 0 0;font-weight:800}.seg-sub{max-width:820px;margin:20px auto 0;text-align:center;color:rgba(255,255,255,.64);font-size:14px;line-height:1.8}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:46px}.card{min-height:285px;padding:28px 26px;border:1px solid rgba(255,255,255,.10);border-radius:20px;background:rgba(255,255,255,.035);opacity:0;transform:translateY(30px)}.num{font-size:11px;letter-spacing:.22em;color:rgba(255,255,255,.42)}.card h3{font-size:29px;margin:15px 0 0}.label{margin-top:8px;font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.46)}.rule{width:42px;height:1px;background:rgba(255,255,255,.2);margin:20px 0}.people{font-size:12px;letter-spacing:.13em;color:rgba(255,255,255,.44)}.card p{font-size:16px;line-height:1.65;color:rgba(255,255,255,.8)}.tags{margin-top:18px;font-size:12px;letter-spacing:.15em;color:rgba(255,255,255,.48)}
  @media(max-width:900px){.cards{grid-template-columns:1fr}.copy{left:28px;top:30px}}
  </style>`;

  d.body.innerHTML=`
  <main>
    <section id="exp"><div class="sticky exp-stage">
      <div id="paint"></div><div id="mintRise"></div><div id="mintSolid"></div><div id="sky" class="sky"></div>
      <div id="pw"><img id="bottle"><img id="logo"></div>
      <div class="tip" id="scrollTip">SCROLL TO EXPERIENCE ↓</div>
      <div class="copy" id="mintCopy"><div class="note">SPEARMINT</div><div class="keywords">COOL · FRESH · CLEAN</div></div>
      <div class="tip" id="touch">CLICK TO SPLASH</div>
    </div></section>

    <section id="sandal"><div class="sticky sandal-stage">
      <div id="sandalSky" class="sky"></div><div id="branchBg"></div><div id="softLight"></div><div id="leafField"></div><div id="windHalo"></div><div id="sandalToMeadow"></div>
      <div class="copy" id="sandalCopy"><div class="note">SANDALWOOD</div><div class="keywords">SOFT · CREAMY · WOODY</div></div>
      <div class="tip" id="windTip">MOVE YOUR CURSOR</div>
    </div></section>

    <section id="lav"><div class="sticky lav-stage">
      <div id="grass"></div><div id="lavLight"></div><div id="forestCarry"></div><div id="blooms"></div><div id="blackFade"></div>
      <div class="copy" id="lavCopy"><div class="note">LAVENDER</div><div class="keywords">SOFT · CALM · GENTLE</div></div>
      <div class="tip" id="bloomTip">CLICK THE FIELD</div>
    </div></section>

    <section id="segment"><div class="sticky seg-stage"><div class="seg-wrap">
      <div class="eyebrow">OFFICIAL NOTES × CONSUMER LANGUAGE</div>
      <div class="seg-title">HOW DIRTY<br>IS FELT</div>
      <div class="seg-sub">The product page names the notes. Consumers translate them into everyday sensory language. This prototype turns that translation into an experience instead of asking users to imagine a scent from ingredients alone.</div>
      <div class="cards">
        <div class="card"><div class="num">01 / OPENING</div><h3>SPEARMINT</h3><div class="label">OFFICIAL NOTE</div><div class="rule"></div><div class="people">WHAT PEOPLE SMELL</div><p>Cool, fresh, clean — an immediate refreshing first impression.</p><div class="tags">COOL · FRESH · CLEAN</div></div>
        <div class="card"><div class="num">02 / BODY</div><h3>SANDALWOOD</h3><div class="label">OFFICIAL NOTE</div><div class="rule"></div><div class="people">WHAT PEOPLE SMELL</div><p>Soft, creamy woodiness that smooths the sharper opening without feeling heavy.</p><div class="tags">SOFT · CREAMY · WOODY</div></div>
        <div class="card"><div class="num">03 / SETTLE</div><h3>LAVENDER</h3><div class="label">OFFICIAL NOTE</div><div class="rule"></div><div class="people">WHAT PEOPLE SMELL</div><p>A gentler, calmer finish layered over the summer freshness.</p><div class="tags">SOFT · CALM · GENTLE</div></div>
      </div>
    </div></div></section>
  </main>`;

  const clamp=(v,a,b)=>Math.min(Math.max(v,a),b),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,easeOut=t=>1-Math.pow(1-t,3),lerp=(a,b,t)=>a+(b-a)*t;
  const exp=d.getElementById('exp'),expStage=exp.firstElementChild,paint=d.getElementById('paint'),mintRise=d.getElementById('mintRise'),mintSolid=d.getElementById('mintSolid'),sky=d.getElementById('sky'),pw=d.getElementById('pw'),bottle=d.getElementById('bottle'),logo=d.getElementById('logo'),mintCopy=d.getElementById('mintCopy'),touch=d.getElementById('touch'),scrollTip=d.getElementById('scrollTip');
  bottle.src=productSrc;logo.src=croppedLogo;

  const sandal=d.getElementById('sandal'),sandalStage=sandal.firstElementChild,branchBg=d.getElementById('branchBg'),softLight=d.getElementById('softLight'),leafField=d.getElementById('leafField'),windHalo=d.getElementById('windHalo'),sandalCopy=d.getElementById('sandalCopy'),windTip=d.getElementById('windTip'),sandalToMeadow=d.getElementById('sandalToMeadow');
  branchBg.style.backgroundImage=sandalBg;branchBg.style.backgroundColor='#7ea774';
  const lav=d.getElementById('lav'),lavStage=lav.firstElementChild,grass=d.getElementById('grass'),forestCarry=d.getElementById('forestCarry'),lavCopy=d.getElementById('lavCopy'),blooms=d.getElementById('blooms'),blackFade=d.getElementById('blackFade'),bloomTip=d.getElementById('bloomTip');
  grass.style.backgroundImage=grassBg;forestCarry.style.backgroundImage=sandalBg;

  /* Dense leaf foreground. If the base file has leaf image assets, reuse them; otherwise fall back to CSS leaf shapes. */
  const leaves=[];
  const totalLeaves=144;
  for(let i=0;i<totalLeaves;i++){
    let el;
    if(leafSources.length){
      el=d.createElement('img');el.src=leafSources[i%leafSources.length];
    }else{
      el=d.createElement('div');el.style.background='linear-gradient(135deg,#4c7b3c,#84ad62)';el.style.borderRadius='80% 10% 80% 10%';
    }
    el.className='leaf';
    el.style.left=(Math.random()*106-3)+'%';el.style.top=(Math.random()*108-4)+'%';
    el.style.width=(210+Math.random()*150)+'px';el.style.height=el.tagName==='DIV'?(80+Math.random()*90)+'px':'auto';
    leafField.appendChild(el);
    leaves.push({el,baseRot:Math.random()*68-34,phase:Math.random()*6.28,tx:0,ty:0,rr:0});
  }

  let mx=-9999,my=-9999;
  sandalStage.addEventListener('mousemove',e=>{const r=sandalStage.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;windHalo.style.opacity='1';windHalo.style.left=mx+'px';windHalo.style.top=my+'px'});
  sandalStage.addEventListener('mouseleave',()=>{mx=-9999;my=-9999;windHalo.style.opacity='0'});

  function leafLoop(){
    const r=sandalStage.getBoundingClientRect(),t=performance.now()/1000;
    leaves.forEach((it,i)=>{
      const br=it.el.getBoundingClientRect(),cx=br.left-r.left+br.width/2,cy=br.top-r.top+br.height/2,dx=cx-mx,dy=cy-my,dist=Math.hypot(dx,dy);
      const inf=Math.pow(Math.max(0,1-dist/300),1.12),px=dx/(dist||1)*175*inf,py=dy/(dist||1)*112*inf;
      const sx=Math.sin(t*1.28+it.phase)*3,sy=Math.cos(t*1.02+it.phase*.8)*2.1,tr=it.baseRot+(-dx/(dist||1))*42*inf+Math.sin(t*.9+it.phase)*1.8;
      it.tx+=(px+sx-it.tx)*.12;it.ty+=(py+sy-it.ty)*.12;it.rr+=(tr-it.rr)*.12;
      it.el.style.transform='translate('+it.tx+'px,'+it.ty+'px) rotate('+it.rr+'deg)';
    });
    w.requestAnimationFrame(leafLoop);
  }
  leafLoop();

  /* Spearmint paint burst */
  function burst(ev){
    const er=exp.getBoundingClientRect(),p=clamp(-er.top/(exp.offsetHeight-w.innerHeight),0,1);
    if(p<.38||p>.72)return;
    const r=expStage.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;
    for(let i=0;i<18;i++){
      const b=d.createElement('div'),core=i<4,size=core?(105+Math.random()*100):(12+Math.random()*40),a=Math.random()*Math.PI*2,dist=core?Math.random()*58:70+Math.random()*210;
      b.className='splash';b.style.left=x+'px';b.style.top=y+'px';b.style.width=size+'px';b.style.height=(size*(.72+Math.random()*.45))+'px';b.style.borderRadius=(35+Math.random()*30)+'% '+(35+Math.random()*30)+'% '+(35+Math.random()*30)+'% '+(35+Math.random()*30)+'%';
      paint.appendChild(b);
      requestAnimationFrame(()=>{b.style.transition='transform 680ms cubic-bezier(.15,.82,.2,1),opacity 180ms ease';b.style.opacity='.98';b.style.transform='translate(calc(-50% + '+(Math.cos(a)*dist)+'px),calc(-50% + '+(Math.sin(a)*dist)+'px)) scale(1) rotate('+(Math.random()*110-55)+'deg)'});
    }
  }
  expStage.addEventListener('click',burst);

  /* Lavender bloom */
  lavStage.addEventListener('click',e=>{
    const r=lavStage.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(y<w.innerHeight*.2)return;
    for(let s=0;s<3;s++){
      const spr=d.createElement('div');spr.className='sprig';const h=42+Math.random()*34;
      spr.style.left=(x+(Math.random()-.5)*55)+'px';spr.style.top=(y+Math.random()*14)+'px';spr.style.height=h+'px';spr.style.transform='translate(-50%,-100%) scaleY(.08)';
      spr.innerHTML='<div class="stem"></div>';
      for(let j=0;j<5;j++){const bud=d.createElement('i');bud.className='bud';bud.style.left=(j%2?10:2)+'px';bud.style.bottom=(10+j*7)+'px';spr.appendChild(bud)}
      blooms.appendChild(spr);
      requestAnimationFrame(()=>{spr.style.transition='transform 820ms cubic-bezier(.15,.84,.2,1),opacity 230ms ease';spr.style.opacity='1';spr.style.transform='translate(-50%,-100%) scaleY(1)'});
    }
  });

  function update(){
    /* intro / product / spearmint */
    let r=exp.getBoundingClientRect(),p=clamp(-r.top/(exp.offsetHeight-w.innerHeight),0,1);
    const reveal=easeOut(clamp((p-.06)/.34,0,1)),H=Math.min(w.innerHeight*.82,900),W=H*(1173/1341),scale=lerp(4.25,1,reveal),cx=w.innerWidth/2,cy=w.innerHeight/2,fx=.556266,fy=.606637;
    pw.style.width=W+'px';pw.style.height=H+'px';
    const startL=cx-scale*W*fx,startT=cy-scale*H*fy,endL=cx-W/2,endT=cy-H/2,pe=ease(reveal);
    pw.style.left=lerp(startL,endL,pe)+'px';pw.style.top=lerp(startT,endT,pe)+'px';pw.style.transform='scale('+scale+')';
    bottle.style.opacity=String(clamp((p-.10)/.15,0,1)*(1-clamp((p-.91)/.07,0,1)));
    logo.style.opacity=String(1-clamp((p-.30)/.16,0,1));
    scrollTip.style.opacity=String(1-clamp(p/.08,0,1));
    const mc=ease(clamp((p-.36)/.08,0,1))*(1-clamp((p-.80)/.08,0,1));mintCopy.style.opacity=String(mc);mintCopy.style.transform='translateY('+(18-18*mc)+'px)';touch.style.opacity=String(mc);
    const rise=ease(clamp((p-.58)/.12,0,1));mintRise.style.opacity=String(rise);mintRise.style.transform='translateY('+(100-100*rise)+'%)';
    paint.style.opacity=String(1-clamp((p-.65)/.07,0,1));mintSolid.style.opacity=String(ease(clamp((p-.67)/.08,0,1)));sky.style.opacity=String(ease(clamp((p-.80)/.14,0,1)));

    /* sandalwood: long hold, then meadow gradient */
    r=sandal.getBoundingClientRect();p=clamp(-r.top/(sandal.offsetHeight-w.innerHeight),0,1);
    const enter=ease(clamp(p/.20,0,1)),exit=ease(clamp((p-.80)/.16,0,1));
    branchBg.style.opacity=String(enter);branchBg.style.transform='scale('+(1.07-.035*enter)+')';softLight.style.opacity=String(.8*enter);leafField.style.opacity=String(enter*(1-.65*exit));
    const sc=ease(clamp((p-.10)/.12,0,1))*(1-clamp((p-.84)/.10,0,1));sandalCopy.style.opacity=String(sc);sandalCopy.style.transform='translateY('+(18-18*sc)+'px)';windTip.style.opacity=String(clamp((p-.18)/.10,0,1)*(1-exit));sandalToMeadow.style.opacity=String(exit);

    /* lavender: crisp grass, longer section, smooth black fade */
    r=lav.getBoundingClientRect();p=clamp(-r.top/(lav.offsetHeight-w.innerHeight),0,1);
    forestCarry.style.opacity=String(1-ease(clamp(p/.24,0,1)));forestCarry.style.transform='translateY('+(-42*ease(clamp(p/.24,0,1)))+'%)';
    const lc=ease(clamp((p-.08)/.12,0,1));lavCopy.style.opacity=String(lc);lavCopy.style.transform='translateY('+(18-18*lc)+'px)';bloomTip.style.opacity=String(clamp((p-.16)/.10,0,1));
    blackFade.style.opacity=String(ease(clamp((p-.76)/.18,0,1)));

    /* segment screen */
    const seg=d.getElementById('segment'),wrap=seg.querySelector('.seg-wrap');r=seg.getBoundingClientRect();p=clamp(-r.top/(seg.offsetHeight-w.innerHeight),0,1);
    const show=ease(clamp((p-.22)/.16,0,1));wrap.style.opacity=String(show);wrap.style.transform='translateY('+(28-28*show)+'px)';
    [...seg.querySelectorAll('.card')].forEach((c,i)=>{const v=ease(clamp((p-(.36+i*.07))/.13,0,1));c.style.opacity=String(v);c.style.transform='translateY('+(30-30*v)+'px)'});
  }
  w.addEventListener('scroll',update,{passive:true});w.addEventListener('resize',update);update();
  loading.style.opacity='0';setTimeout(()=>loading.remove(),500);
});
</script>
</body>
</html>
